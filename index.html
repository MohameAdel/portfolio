<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohamed Adel</title>
  <meta name="description"
    content="Portfolio of Mohamed Adel, Front-End Developer specializing in Shopify, WordPress, and e-commerce stores.">
  <meta name="keywords" content="Mohamed Adel, Front-End Developer, Shopify, WordPress, E-commerce, Web Development">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Preloader -->
  <div id="preloader">
    <div class="loader-content">
      <div class="loader-text">Materializing shapes...</div>
      <div class="loader-progress"></div>
    </div>
  </div>

  <!-- Navigation Overlay -->
  <div id="nav-overlay">
    <div class="nav-links">
      <a href="#hero" class="nav-item">Home</a>
      <a href="#work" class="nav-item">Work</a>
      <a href="#about" class="nav-item">About</a>
      <a href="#contact" class="nav-item">Contact</a>
    </div>
  </div>

  <!-- Floating Contact Action Button (FAB) -->
  <a href="#contact" id="floating-contact-btn" aria-label="Contact Me">
    <div class="fab-glow"></div>
    <div class="fab-content">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
      <span class="fab-label">Contact Me</span>
    </div>
  </a>

  <!-- Global Canvas -->
  <canvas id="hero-canvas"></canvas>

  <!-- App Container -->
  <main id="app">
    <!-- Router injects views here -->
  </main>
  
  <!-- Lightbox -->
  <div id="lightbox" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center;">
    <button id="lightbox-close" style="position: absolute; top: 20px; right: 30px; background: none; border: none; color: #fff; font-size: 3rem; cursor: pointer;">&times;</button>
    <button id="lightbox-prev" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #fff; font-size: 3rem; cursor: pointer;">&#10094;</button>
    <img id="lightbox-img" src="" alt="Gallery Image" style="max-width: 90%; max-height: 90%; object-fit: contain;">
    <button id="lightbox-next" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #fff; font-size: 3rem; cursor: pointer;">&#10095;</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
